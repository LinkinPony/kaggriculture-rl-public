# PPO is the strategic actor; Kaito supplies only a frozen proposal and executor.
output_dir: outputs/route-ppo/20260830-event-route-ppo-v1
public_agent_manifest: data/external/kaggriculture-public-notebooks-2026-08-28/manifest.json
seed: 20260830
rollout_seed_start: 10000000
updates: 400
opponents: [kaito_v48, mugundh_v21, boatlee_v21, kaito_v39]
opponent_weights:
  kaito_v48: 0.25
  mugundh_v21: 0.25
  boatlee_v21: 0.25
  kaito_v39: 0.25
paired_seats: true
selection_seed_start: 76000
confirmation_seed_start: 76100
evaluation_seed_count: 48

model:
  hidden_width: 128
  feedforward_width: 256
  prior_logit: 3.0

optimization:
  ppo_epochs: 4
  decisions_per_minibatch: 1024
  learning_rate: 0.0003
  weight_decay: 0.00001
  clip_epsilon: 0.15
  value_loss_weight: 0.25
  entropy_weight: 0.0
  target_kl: 0.02
  gradient_clip: 1.0
  normalize_advantage: true
  discount: 1.0
  gae_lambda: 1.0

rollout:
  seeds_per_update: 256
  cpu_workers: 48
  unit_limit: 65

checkpoint:
  rolling_interval: 5
  permanent_interval: 25

device: cuda:0
cpu_threads: 8
act_timeout_seconds: 1.0
remaining_overage_seconds: 60.0
environment:
  episodeSteps: 720
  maxMarketOrdersPerTurn: 10
