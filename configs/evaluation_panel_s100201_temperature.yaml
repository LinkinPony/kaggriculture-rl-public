    - {name: clone-dsm, group: dsm, path: outputs/analysis/s100901-u0480-temperature-20260929/actors/clone-dsm.pt}
    - {name: clone-vadim, group: vadim, path: outputs/analysis/s100901-u0480-temperature-20260929/actors/clone-vadim.pt}
