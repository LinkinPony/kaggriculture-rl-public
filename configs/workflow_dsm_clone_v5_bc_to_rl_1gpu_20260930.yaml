# Hand the completed v5 latest-version DSM clone (s101501) to single-GPU PPO on cuda:0 through
# validation selection, beside s101401 on cuda:1.
defaults:
- learning_dsm_clone_v5_latest_u756_bc_20260930@bc_stage
- learning_dsm_clone_v5_kl_ppo50_1gpu_20260930@rl_stage
- _self_
bc_stage:
  experiment:
    output_dir: outputs/learning/dsm-clone-v5-latest-from-u756-bc-20260930-s101501
    seed: 101501
    device: cuda:0
    execution:
      devices: [cuda:0]
workflow:
  output_dir: outputs/workflows/dsm-clone-v5-latest-bc-to-rl-1gpu-20260930
  bc: ${bc_stage.experiment}
  rl: ${rl_stage.experiment}
  historical_archive: ${rl_stage.historical_archive}
  attached_bc: true
hydra:
  run:
    dir: ${workflow.output_dir}/hydra
  output_subdir: null
  job:
    chdir: false
