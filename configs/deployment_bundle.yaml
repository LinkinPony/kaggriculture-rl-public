deployment:
  run: outputs/learning/scratch-scaling-s51001
  member: checkpoints/update-000512.pt
  output_dir: outputs/deployment/grounded-${now:%Y%m%d-%H%M%S}
  sampling_seed: 1210000000
  cpu_threads: 1
  native:
    interpreters:
      - ${oc.env:REVUE_PYTHON_311,/usr/bin/python3.11}
      - /usr/bin/python3.12
    compiler: ${oc.env:REVUE_CXX,/usr/bin/g++}
    patchelf: ${oc.env:REVUE_PATCHELF,/usr/bin/patchelf}
    max_glibc: '2.35'
    jobs: 12
hydra:
  job:
    chdir: false
  run:
    dir: outputs/analysis/deployment-bundle/hydra
  output_subdir: null
