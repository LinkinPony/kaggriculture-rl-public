# MMPQ clone v4 with the parallel unit decoder, both at T=0 (validation-best epochs).
# Seeds, references and precision match evaluation_mmpq_bc_temperature_20260930, whose
# mmpq-v3-t0 row is the baseline; the v3 clone at T=0 is added as a direct opponent.
study:
  output: outputs/analysis/mmpq-bc-redesign-20260930/v4-parallel
  games: 128
  seed: 9500000000
  sampling_seed: 95000001
  devices: [cuda:0, cuda:1, cuda:0, cuda:1]
  memory_fraction: 0.06
  precision: bf16
  scope: >-
    MMPQ v4 clones (current-plan data; cosine or constant-rate BC; parallel unit decoder) at
    T=0 against four T=1 references and the v3 clone at T=0, on 64 common seeds with both
    seats. Local proxy only.
  candidates:
    - name: v4-parallel-t0
      temperature: 0
      run: outputs/learning/mmpq-clone-v4-parallel-bc-20260930-s101001
    - name: v4-parallel-const-t0
      temperature: 0
      run: outputs/learning/mmpq-clone-v4-parallel-const-bc-20260930-s101004
  opponents:
    - name: s99001-u0200
      group: s99001
      path: outputs/analysis/s99001-checkpoint-comparison-20260928/actors/u0200.pt
    - name: s100201-u0200
      group: s100201
      run: outputs/learning/derived-v5b-m384-dsmclone-ppo50-warmup300-20260929-s100201
      member: checkpoints/update-000200.pt
    - {name: clone-dsm, group: dsm, run: outputs/learning/team-clone-dsm-bc-20260929-s100012}
    - {name: clone-mm-pq-v1, group: mm-pq, run: outputs/learning/team-clone-mm-pq-bc-20260929-s100011}
    - name: clone-mm-pq-v3-t0
      group: mm-pq-v3
      temperature: 0
      run: outputs/learning/team-clone-v3-mm-pq-bc-20260929-s100023
hydra:
  job:
    chdir: false
  run:
    dir: ${study.output}/hydra
  output_subdir: null
