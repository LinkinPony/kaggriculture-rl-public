# s100101 checkpoints against opponents that are not in its PFSP pool (s99001 U588, U256,
# U192 and the 9/29 BC); the s99001 U200 start is the reference candidate.
defaults:
  - evaluation_panel
  - _self_
study:
  output: outputs/analysis/heldout-panel-20260929-s100101
  seed: 9410000000
  sampling_seed: 94100001
  memory_fraction: 0.025
  devices: [cuda:0, cuda:1, cuda:0, cuda:1]
  scope: >-
    Held-out s99001 checkpoints and the 9/29 BC as opponents; none is in the s100101 pool.
  candidates:
    - {name: s99001-u0200, path: outputs/analysis/s99001-checkpoint-comparison-20260928/actors/u0200.pt}
    - {name: s100101-u0100, run: outputs/learning/derived-v5b-m384-u200-clones-ppo50-warmup300-20260929-s100101, member: checkpoints/update-000100.pt}
    - {name: s100101-u0200, run: outputs/learning/derived-v5b-m384-u200-clones-ppo50-warmup300-20260929-s100101, member: checkpoints/update-000200.pt}
    - {name: s100101-u0300, run: outputs/learning/derived-v5b-m384-u200-clones-ppo50-warmup300-20260929-s100101, member: checkpoints/update-000300.pt}
  opponents:
    - {name: s99001-u0588, group: u0588, path: outputs/analysis/s99001-checkpoint-comparison-20260928/actors/u0588.pt}
    - {name: s99001-u0256, group: u0256, path: outputs/analysis/s99001-checkpoint-comparison-20260928/actors/u0256.pt}
    - {name: s99001-u0192, group: u0192, path: outputs/analysis/s99001-checkpoint-comparison-20260928/actors/u0192.pt}
    - {name: s100001-bc-e9, group: bc0929, run: outputs/learning/derived-v5b-m384-u0-strength-canonical-bc-20260929-s100001, member: pretraining/shard-000576.pt}
hydra:
  run:
    dir: tmp/hydra/heldout-panel-20260929-s100101
