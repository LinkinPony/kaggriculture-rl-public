unit_task_bc:
  dataset_dir: data/external/kaggriculture-episodes-2026-08-29_2026-09-01/factorized-scratch-unit-task-k2-full-v3
  output_dir: outputs/unit-task-bc/20260901-daily-scratch-factorized-v3
  resume_policy_checkpoint: null

  source:
    index_archive: data/external/kaggriculture-episodes-2026-08-29_2026-09-01/raw/kaggriculture-episodes-index.zip
    source_archives:
      - data/external/kaggriculture-episodes-2026-08-29_2026-09-01/raw/kaggriculture-episodes-2026-08-29.zip
      - data/external/kaggriculture-episodes-2026-08-29_2026-09-01/raw/kaggriculture-episodes-2026-08-30.zip
      - data/external/kaggriculture-episodes-2026-08-29_2026-09-01/raw/kaggriculture-episodes-2026-08-31.zip
    days: 3
    validation_fraction: 0.05
    test_fraction: 0.05
    workers: 16
    worker_cpu_threads: 2
    maximum_rejection_fraction: 0.01
    contract:
      replay_schema_version: 1
      module_version: 1.32.7
      agents: 2
      episode_steps: 720
      board_size: 10
      max_market_orders: 10
      unit_limit: 32

  sampling:
    tasks_per_suffix: 2
    decisions_per_sequence: 256
    seed: 20260901

  abi:
    unit_limit: 32
    maximum_quantity: 128

  actor:
    model_width: 256
    entity_width: 128
    attention_heads: 4
    feedforward_width: 704
    latent_tokens: 64
    register_tokens: 4
    scene_layers: 2
    temporal_layers: 20
    action_layers: 2
    max_history: 720
    max_decisions: 42
    maximum_quantity: 128
    fact_dropout: 0.25
    skill_tokens: 0
    strategy_tokens: 8
    strategy_version: gru-v1
    economic_feature_version: economic-consequences-v2

  model:
    architecture_version: factorized-v3
    model_width: 128
    feedforward_width: 384
    attention_heads: 4
    prefix_layers: 1

  optimization:
    epochs: 15
    outcome_epochs: 10
    policy_early_stopping_patience: 3
    outcome_early_stopping_patience: 2
    early_stopping_minimum_relative_improvement: 0.005
    batch_sequences: 8
    learning_rate: 0.0001
    outcome_learning_rate: 0.0003
    weight_decay: 0.00001
    task_loss_weight: 1.0
    market_loss_weight: 1.0
    quantity_loss_weight: 1.0
    gradient_clip: 1.0
    seed: 20260901
    device: cuda:0
    cpu_threads: 8
    loader_workers: 8
    prefetch_shards: 16

  evaluation:
    enabled: true
    public_agent_manifest: data/external/kaggriculture-public-notebooks-2026-08-28/manifest.json
    opponents: [deterministic_incumbent, kaito_v39]
    seeds: [32000000]
    device: cuda:0
    cpu_threads: 4
    batch_games: 16
    actor_streams: 2
    smoke_transitions: 2
    act_timeout_seconds: 1.0
    remaining_overage_seconds: 60.0

  environment:
    episodeSteps: 720
    maxMarketOrdersPerTurn: 10
