# Pure single-team BC clones against each other and against s99001 U200, U588 and U0
# (the Boey clone is excluded: every candidate scores about 100% against it).
defaults:
  - evaluation_panel
  - _self_
study:
  output: outputs/analysis/clone-round-robin-20260929
  mode: round_robin
  games: 64
  seed: 9420000000
  sampling_seed: 94200001
  memory_fraction: 0.025
  devices: [cuda:0, cuda:1, cuda:0, cuda:1]
  scope: >-
    Complete round robin of s99001 checkpoints and single-team BC clones; local only.
  candidates:
    - {name: s99001-u0200, path: outputs/analysis/s99001-checkpoint-comparison-20260928/actors/u0200.pt}
    - {name: s99001-u0588, path: outputs/analysis/s99001-checkpoint-comparison-20260928/actors/u0588.pt}
    - {name: s99001-u0000, path: outputs/analysis/s99001-checkpoint-comparison-20260928/actors/u0000.pt}
    - {name: clone-dsm, run: outputs/learning/team-clone-dsm-bc-20260929-s100012}
    - {name: clone-vadim, run: outputs/learning/team-clone-vadim-bc-20260929-s100013}
    - {name: clone-tufa, run: outputs/learning/team-clone-tufa-bc-20260929-s100016}
    - {name: clone-mm-pq, run: outputs/learning/team-clone-mm-pq-bc-20260929-s100011}
    - {name: clone-decem, run: outputs/learning/team-clone-decem-bc-20260929-s100014}
  opponents: []
hydra:
  run:
    dir: tmp/hydra/clone-round-robin-20260929
