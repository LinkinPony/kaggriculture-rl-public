# Diagnosis for the MMPQ BC redesign: does argmax decoding recover the v3 clone?
# Candidates are the frozen v3 clone at T=0 and T=1; every reference plays at T=1.
# s99001 U200 is Kaggle submission 56658433, which the live MMPQ beat 6-0.
study:
  output: outputs/analysis/mmpq-bc-redesign-20260930/temperature
  games: 128
  seed: 9500000000
  sampling_seed: 95000001
  devices: [cuda:0, cuda:1, cuda:0, cuda:1]
  memory_fraction: 0.06
  precision: bf16
  scope: >-
    Existing MMPQ v3 clone (validation-best epoch 9) at T=0 and T=1 against four T=1
    references on 64 common seeds with both seats. Local proxy only.
  candidates:
    - name: mmpq-v3-t0
      temperature: 0
      run: outputs/learning/team-clone-v3-mm-pq-bc-20260929-s100023
    - name: mmpq-v3-t1
      temperature: 1
      run: outputs/learning/team-clone-v3-mm-pq-bc-20260929-s100023
  opponents:
    - name: s99001-u0200
      group: s99001
      path: outputs/analysis/s99001-checkpoint-comparison-20260928/actors/u0200.pt
    - name: s100201-u0200
      group: s100201
      run: outputs/learning/derived-v5b-m384-dsmclone-ppo50-warmup300-20260929-s100201
      member: checkpoints/update-000200.pt
    - {name: clone-dsm, group: dsm, run: outputs/learning/team-clone-dsm-bc-20260929-s100012}
    - {name: clone-mm-pq-v1, group: mm-pq, run: outputs/learning/team-clone-mm-pq-bc-20260929-s100011}
hydra:
  job:
    chdir: false
  run:
    dir: ${study.output}/hydra
  output_subdir: null
