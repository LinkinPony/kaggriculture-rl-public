# s100101 checkpoints on the same six-clone panel and seeds as clone-panel-20260929; the
# s99001 U200 anchor must reproduce its earlier games exactly. Clones are in the training pool.
defaults:
  - evaluation_panel
  - _self_
study:
  output: outputs/analysis/clone-panel-20260929-s100101
  memory_fraction: 0.025
  devices: [cuda:0, cuda:1, cuda:0, cuda:1]
  candidates:
    - {name: s99001-u0200, path: outputs/analysis/s99001-checkpoint-comparison-20260928/actors/u0200.pt}
    - {name: s100101-u0100, run: outputs/learning/derived-v5b-m384-u200-clones-ppo50-warmup300-20260929-s100101, member: checkpoints/update-000100.pt}
    - {name: s100101-u0200, run: outputs/learning/derived-v5b-m384-u200-clones-ppo50-warmup300-20260929-s100101, member: checkpoints/update-000200.pt}
    - {name: s100101-u0300, run: outputs/learning/derived-v5b-m384-u200-clones-ppo50-warmup300-20260929-s100101, member: checkpoints/update-000300.pt}
hydra:
  run:
    dir: tmp/hydra/clone-panel-20260929-s100101
