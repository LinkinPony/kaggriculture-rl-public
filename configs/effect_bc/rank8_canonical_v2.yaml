# Retrain Rank8 imitation with padding-invariant atomic-effect entity positions.
dataset_dir: data/external/kaggle-submission-55708706-teacher/atomic-effect-v2-rank8-bc256
dataset_id: cfbcde12e36bdafcca9967e1db6688b8c6238820bb263d92c0e3f6353fd4ce86
output_dir: outputs/effect-policy-bc/20260904-rank8-canonical-pos-v2-bc256-e32
initial_actor: outputs/turn-policy/20260828-opening-diverse-bc2-v1/actor-fp16.pt
initial_checkpoint: null
validation_games: 16
test_games: 16
unit_limit: 32

model:
  model_width: 256
  feedforward_width: 704
  attention_heads: 4
  state_layers: 2
  train_turn_encoder: true

optimization:
  epochs: 32
  # One complete physical game per H200; both seats remain together.
  games_per_batch: 2
  learning_rate: 0.00005
  weight_decay: 0.00001
  outcome_loss_weight: 0.05
  gradient_clip: 1.0
  seed: 20260904
  device: cuda:0
  cpu_threads: 16
  loader_workers: 4
  prefetch_batches: 4
  candidate_elements_per_chunk: 2000000

environment:
  boardSize: 10
  episodeSteps: 720
  turnsPerDay: 24
  maxMarketOrdersPerTurn: 10
