# Held-out direct-outcome gate for the coherent frozen-teacher warm start.
initial_actor: outputs/turn-policy/20260828-opening-diverse-bc2-v1/actor-fp16.pt
initial_checkpoint: outputs/conditional-program-bc/20260902-kaito-v48-vs-v39-v1/checkpoints/best.pt
resume_checkpoint: null
public_agent_manifest: data/external/kaggriculture-public-notebooks-2026-08-28/manifest.json
output_dir: outputs/conditional-program-rl/20260902-kaito-v48-warm-start-v1

seed: 20260902
rollout_seed_start: 7000000
updates: 1
opponents: [deterministic_incumbent, kaito_v39, kaito_v48]
opponent_weights:
  deterministic_incumbent: 0.3333333333333333
  kaito_v39: 0.3333333333333333
  kaito_v48: 0.3333333333333333
paired_seats: true

abi:
  unit_limit: 32

model:
  model_width: 128
  feedforward_width: 384

objective:
  reward: terminal_wdl
  discount: 1.0
  gae_lambda: 1.0

optimization:
  ppo_epochs: 1
  episodes_per_minibatch: 192
  episodes_per_microbatch: 8
  learning_rate: 0.00001
  weight_decay: 0.00001
  clip_epsilon: 0.1
  value_loss_weight: 1.0
  entropy_weight: 0.001
  gradient_clip: 1.0
  target_kl: 0.02
  normalize_advantage: true

rollout:
  seeds_per_update: 192
  batch_games: 384
  devices: [cuda:0, cuda:1]
  cpu_workers: 48
  actor_streams: 8
  host_memory_limit_gib: 16

checkpoint:
  rolling_interval: 1
  rolling_keep: 1
  permanent_interval: 1

device: cuda:0
cpu_threads: 8
act_timeout_seconds: 1.0
remaining_overage_seconds: 60.0
environment:
  episodeSteps: 720
  maxMarketOrdersPerTurn: 10
