# Research challenger only; promotion requires separate complete held-out panels.
initial_actor: outputs/turn-policy/20260828-opening-diverse-bc2-v1/actor-fp16.pt
initial_checkpoint: null
resume_checkpoint: outputs/conditional-program-rl/20260902-daily-bc-e14-selfplay-100k-v1/checkpoints/resume/checkpoint-00000025.pt
public_agent_manifest: null
output_dir: outputs/conditional-program-rl/20260902-daily-bc-e14-selfplay-100k-v1

seed: 20260902
rollout_seed_start: 6200000
updates: 100000
opponents: [self_play]
opponent_weights:
  self_play: 1.0
paired_seats: true

abi:
  unit_limit: 32

model:
  model_width: 128
  feedforward_width: 384

objective:
  reward: terminal_wdl
  discount: 1.0
  gae_lambda: 1.0

optimization:
  ppo_epochs: 2
  episodes_per_minibatch: 512
  episodes_per_microbatch: 8
  learning_rate: 0.00001
  weight_decay: 0.00001
  clip_epsilon: 0.1
  value_loss_weight: 1.0
  entropy_weight: 0.001
  gradient_clip: 1.0
  target_kl: 0.02
  normalize_advantage: true

rollout:
  seeds_per_update: 1024
  batch_games: 2048
  devices: [cuda:0, cuda:1]
  cpu_workers: 48
  actor_streams: 8
  host_memory_limit_gib: 16

checkpoint:
  rolling_interval: 5
  rolling_keep: 5
  permanent_interval: 50

device: cuda:0
cpu_threads: 8
act_timeout_seconds: 1.0
remaining_overage_seconds: 60.0
environment:
  episodeSteps: 720
  maxMarketOrdersPerTurn: 10
