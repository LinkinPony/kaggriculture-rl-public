abi:
  version: 3
  production_lines: 8
  line_fields: 6
  global_fields: 10
  mode_tokens: 2
  line_operation_tokens: 3
  line_value_tokens: 16
  global_operation_tokens: 2
  global_value_tokens: 16
  observation_features: 90
  journal_features: 32
  event_features: 32

model:
  model_width: 256
  entity_width: 128
  attention_heads: 4
  feedforward_width: 704
  latent_tokens: 64
  register_tokens: 4
  scene_layers: 2
  temporal_layers: 20
  action_layers: 2
  max_history: 64
  strategy_tokens: 8
  fact_dropout: 0.25

versions:
  language: independent-execution-portfolio-language-v5
  observation: actor-visible-rich-portfolio-observation-v3
  grammar: parallel-prefix-portfolio-grammar-v6
  executor: native-portfolio-executor-v7

objective:
  reward: terminal_wdl
  discount: 1.0
  gae_lambda: 1.0

optimization:
  ppo_epochs: 2
  episodes_per_minibatch: 320
  actor_learning_rate: 0.000005
  critic_learning_rate: 0.0001
  weight_decay: 0.00001
  clip_epsilon: 0.1
  value_loss_weight: 1.0
  entropy_weight: 0.001
  target_kl: 0.02
  gradient_clip: 1.0
  normalize_advantage: true

rollout:
  seeds_per_update: 2048
  cpu_workers: 48
  inference_batch_size: 2048
  event_cuda_graph_max_batch_size: 16
  host_memory_limit_gib: 16
  gpu_memory_fraction: 0.5

self_play:
  historical_fraction: 0.5
  snapshot_interval: 25
  history_capacity: 8

health:
  warmup_updates: 50
  anchor_panels: 3
  stop_fraction_floor: 0.9
  plan_change_fraction_ceiling: 0.1
  anchor_loss_rate_floor: 0.8

checkpoint:
  rolling_interval: 10
  rolling_keep: 3
  permanent_interval: 100

observability:
  tensorboard: true
  flush_seconds: 10
  max_queue: 20

devices: [cuda:0, cuda:1]
cpu_threads: 16
act_timeout_seconds: 1.0
remaining_overage_seconds: 60.0
environment:
  episodeSteps: 720
  maxMarketOrdersPerTurn: 10
