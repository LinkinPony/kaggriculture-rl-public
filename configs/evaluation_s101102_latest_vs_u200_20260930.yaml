# s101102 U400 at T=0 head to head against the recommended-but-unsubmitted U200, the RL
# start point (v4 P MMPQ clone) and the current Kaggle submission s100901 U480 (56689315),
# all at T=0, on fresh seeds. Decides whether the built U200 package is still the right
# submission. Measured panel workers hold about 2.3 GB each, so two per GPU next to the
# scheduled progress panels keep every card far above the shared 12 GiB reserve.
study:
  output: outputs/analysis/s101102-latest-vs-u200-20260930
  games: 512
  seed: 9750000000
  sampling_seed: 97500001
  devices: [cuda:0, cuda:1, cuda:0, cuda:1]
  memory_fraction: 0.06
  precision: bf16
  scope: >-
    s101102 U400 at T=0 against s101102 U200 (built candidate package 0eec4dfe), the v4 P
    MMPQ clone (s101001 epoch 9) and s100901 U480 (Kaggle 56689315), all at T=0, on 256
    fresh common seeds with both seats. Local proxy only.
  candidates:
    - name: s101102-u0400-t0
      temperature: 0
      run: outputs/learning/derived-v5b-m384-mmpqclone4-kl-ppo50-1gpu-20260930-s101102
      member: checkpoints/update-000400.pt
  opponents:
    - name: s101102-u0200-t0
      group: s101102-u0200
      temperature: 0
      path: outputs/analysis/s101102-vs-mmpq-clone-20260930/actors/s101102-u0200-t0.pt
    - name: mmpq-v4-p-t0
      group: mmpq-v4-p
      temperature: 0
      run: outputs/learning/mmpq-clone-v4-parallel-bc-20260930-s101001
    - name: s100901-u0480-t0
      group: s100901-u0480
      temperature: 0
      path: outputs/analysis/s100901-u0480-temperature-20260929/actors/s100901-u0480-t0.pt
hydra:
  job:
    chdir: false
  run:
    dir: ${study.output}/hydra
  output_subdir: null
